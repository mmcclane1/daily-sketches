<title>pond score — 2026-11-01</title>

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; cursor: crosshair; touch-action: none; }
  canvas.grab { cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  .label, .hint {
    position: fixed; left: 16px; padding: 2px 6px; background: #000; color: #666;
    font: 11px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .08em; text-transform: lowercase; user-select: none;
  }
  .label { top: 14px; }
  .hint { bottom: 14px; right: 16px; width: fit-content; color: #444; pointer-events: none; }
  .hint b { font-weight: normal; color: #ff2a1f; }
  .label a { color: inherit; text-decoration: none; }
  .label a:hover { color: #fff; }

<body>
<div class="label"><a href="../index.html">←</a> 2026-11-01 / pond score</div>
<div class="hint"><span id="sound"><b>tap to hear</b> · </span>tap to drop / lift an x · drag the @ · tap it to pulse<span id="keys"> · space pulse · ↑↓ tempo · r scatter · c clear · m mute</span></div>
<canvas></canvas>
<script>
// A score you write with distance. The red @ sends out a ring every beat.
// Rings spread across a pond of glyphs, and when a crest passes an X it plays
// a note (higher up the screen = higher pitch, left/right = pan, louder the
// closer to the source). Every X the source's ring hits sends out its own
// weaker echo ring (echoes don't echo again), so a cluster of marks answers
// itself. Rhythm is just geometry: how far each X
// sits from the @ and from the others.
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
const soundEl = document.getElementById("sound");
const keysEl = document.getElementById("keys");
const RED = "#ff2a1f";
const RAMP = " .,:-=+*#%@";
const LEVELS = RAMP.length - 1;
const SCALE = [0, 2, 4, 7, 9];      // major pentatonic
const BASE_HZ = 130.81;             // C3
const NOTES = 16;                   // pitches top to bottom
const ECHO = 0.5;                   // echo ring strength relative to the hit
const MIN_HIT = 0.07;               // quieter crossings don't sound
const REST = 0.4;                   // s before the same X can sound again
const VOICES = 6;                   // most notes allowed to start in any 0.25 s

let W, H, dpr, fs, CW, CH, cols, rows, field;
let speed, fade;                    // ring speed (px/s) and strength decay length (px)
let period = 2;                     // s between source pulses
let source = { fx: 0.5, fy: 0.5 };
let marks = [];                     // { fx, fy, flash, last }
let rings = [];                     // { x, y, r, s, from, echo }
let lastPulse = -Infinity, now = 0, prev = 0;
let audio = null, muted = false, recent = [];

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  fs = W < 600 ? 12 : 14;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${fs}px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace`;
  CW = Math.ceil(ctx.measureText("M").width);
  CH = Math.round(fs * 1.25);
  cols = Math.ceil(W / CW);
  rows = Math.ceil(H / CH);
  field = new Float32Array(cols * rows);
  const diag = Math.hypot(W, H);
  speed = diag / 7;
  fade = diag * 0.45;
  keysEl.style.display = matchMedia("(pointer: coarse)").matches ? "none" : "";
  rings = [];
}
addEventListener("resize", resize);
resize();

// Marks live in screen fractions so they survive a resize, but always sit on a cell.
const cellOf = (fx, fy) => [Math.min(cols - 1, Math.floor(fx * W / CW)), Math.min(rows - 1, Math.floor(fy * H / CH))];
const centre = (c, r) => [c * CW + CW / 2, r * CH + CH / 2];
const markXY = (m) => centre(...cellOf(m.fx, m.fy));
const sourceXY = () => centre(...cellOf(source.fx, source.fy));

function scatter() {
  marks = [];
  const n = 7 + Math.floor(Math.random() * 6);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = 0.12 + Math.random() * 0.33;
    const fx = 0.5 + Math.cos(a) * d * Math.min(1, H / W), fy = 0.5 + Math.sin(a) * d * Math.min(1, W / H);
    marks.push({ fx: Math.min(0.97, Math.max(0.03, fx)), fy: Math.min(0.92, Math.max(0.08, fy)), flash: -1, last: -1 });
  }
}
scatter();

// ---- sound -------------------------------------------------------------

function startAudio() {
  if (audio) { if (audio.ctx.state !== "running") audio.ctx.resume(); return; }
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain();
  master.gain.value = 0.5;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6;
  master.connect(comp).connect(ac.destination);
  // a short dark echo so single plucks have some water around them
  const delay = ac.createDelay(1);
  delay.delayTime.value = 0.27;
  const fb = ac.createGain();
  fb.gain.value = 0.38;
  const tone = ac.createBiquadFilter();
  tone.type = "lowpass"; tone.frequency.value = 1800;
  const send = ac.createGain();
  send.gain.value = 0.28;
  send.connect(delay).connect(tone).connect(fb).connect(delay);
  tone.connect(master);
  audio = { ctx: ac, master, send };
  ac.resume();
}

function pluck(m, strength) {
  if (!audio || muted || audio.ctx.state !== "running") return;
  const ac = audio.ctx, t = ac.currentTime;
  const [c, r] = cellOf(m.fx, m.fy);
  const step = NOTES - 1 - Math.min(NOTES - 1, Math.floor(r / rows * NOTES));
  const semis = 12 * Math.floor(step / SCALE.length) + SCALE[step % SCALE.length];
  const hz = BASE_HZ * 2 ** (semis / 12);
  const v = Math.min(1, strength) * 0.35;

  const out = ac.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(v, t + 0.004);
  out.gain.exponentialRampToValueAtTime(0.0001, t + 0.5 + strength * 1.2);
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.setValueAtTime(600 + 5000 * strength, t);
  lp.frequency.exponentialRampToValueAtTime(300, t + 0.6);
  const pan = ac.createStereoPanner();
  pan.pan.value = (c / (cols - 1)) * 1.6 - 0.8;

  const a = ac.createOscillator();
  a.type = "triangle"; a.frequency.value = hz;
  const b = ac.createOscillator();
  b.type = "sine"; b.frequency.value = hz * 2.01;
  const bg = ac.createGain();
  bg.gain.value = 0.3;
  a.connect(lp); b.connect(bg).connect(lp);
  lp.connect(out).connect(pan);
  pan.connect(audio.master); pan.connect(audio.send);
  const end = t + 0.6 + strength * 1.3;
  a.start(t); b.start(t); a.stop(end); b.stop(end);
}

function setSoundLabel() {
  soundEl.firstChild.textContent = muted ? "muted (m)" : "tap to hear";
  soundEl.style.display = audio && !muted ? "none" : "";
}

// ---- rings -------------------------------------------------------------

function pulse(x, y, s, from) {
  rings.push({ x, y, r: 0, s, from, echo: !!from });
  if (rings.length > 80) {
    rings.sort((p, q) => q.s * Math.exp(-q.r / fade) - p.s * Math.exp(-p.r / fade));
    rings.length = 80;
  }
}

function step(dt) {
  if (now - lastPulse >= period) {
    lastPulse = now;
    pulse(...sourceXY(), 1, null);
  }
  const hits = [];
  for (const ring of rings) {
    const r0 = ring.r;
    ring.r += speed * dt;
    for (const m of marks) {
      if (m === ring.from) continue;
      const [mx, my] = markXY(m);
      const d = Math.hypot(mx - ring.x, my - ring.y);
      if (d <= r0 || d > ring.r) continue;
      const s = ring.s * Math.exp(-d / fade);
      if (s < MIN_HIT || now - m.last < REST) continue;
      m.last = now;
      hits.push([m, s, ring.echo]);
    }
  }
  // Loudest first; past the voice budget a hit still flashes but stays silent.
  hits.sort((p, q) => q[1] - p[1]);
  recent = recent.filter((t) => now - t < 0.25);
  for (const [m, s, echo] of hits) {
    m.flash = now;
    if (recent.length < VOICES) { recent.push(now); pluck(m, s); }
    if (!echo && s * ECHO >= MIN_HIT) pulse(...markXY(m), s * ECHO, m);
  }
  const far = Math.hypot(W, H);
  rings = rings.filter((g) => g.r < far + 40 && g.s * Math.exp(-g.r / fade) > 0.02);
}

// Each ring adds a sharp crest and a ringing wake behind it. Only cells in the
// ring's annulus are visited, row by row.
function fillField() {
  field.fill(0);
  const crest = CH * 0.7, wake = CH * 9, lambda = CH * 0.55;
  for (const g of rings) {
    const amp = g.s * Math.exp(-g.r / fade);
    const rOut = g.r + crest * 2, rIn = Math.max(0, g.r - wake);
    const j0 = Math.max(0, Math.floor((g.y - rOut) / CH)), j1 = Math.min(rows - 1, Math.floor((g.y + rOut) / CH));
    for (let j = j0; j <= j1; j++) {
      const dy = j * CH + CH / 2 - g.y;
      const xo = Math.sqrt(Math.max(0, rOut * rOut - dy * dy));
      const xi = Math.abs(dy) < rIn ? Math.sqrt(rIn * rIn - dy * dy) : 0;
      for (const [lo, hi] of [[g.x - xo, g.x - xi], [g.x + xi, g.x + xo]]) {
        const i0 = Math.max(0, Math.floor(lo / CW)), i1 = Math.min(cols - 1, Math.floor(hi / CW));
        for (let i = i0; i <= i1; i++) {
          const dx = i * CW + CW / 2 - g.x;
          const u = Math.sqrt(dx * dx + dy * dy) - g.r;
          let v = Math.exp(-(u * u) / (crest * crest));
          if (u < 0) v += 0.5 * Math.cos(u / lambda) * Math.exp(u / (wake / 3));
          field[j * cols + i] += amp * v;
        }
      }
    }
  }
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const taken = new Set();
  for (const m of marks) { const [c, r] = cellOf(m.fx, m.fy); taken.add(r * cols + c); }
  const [sc, sr] = cellOf(source.fx, source.fy);
  taken.add(sr * cols + sc);

  // still water: a sparse slow shimmer of dots so the pond is there at rest
  const buckets = Array.from({ length: LEVELS + 1 }, () => []);
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const k = j * cols + i;
      if (taken.has(k)) continue;
      const v = Math.abs(field[k]);
      let lvl = Math.min(LEVELS, Math.floor(v * 1.3 * LEVELS));
      if (lvl === 0) {
        const s = Math.sin(i * 0.37 + now * 0.5) * Math.sin(j * 0.61 - now * 0.35) + Math.sin((i + j) * 0.13 + now * 0.2);
        if (s < 1.45) continue;
        buckets[0].push(".", i * CW + CW / 2, j * CH + CH / 2);
        continue;
      }
      buckets[lvl].push(RAMP[lvl], i * CW + CW / 2, j * CH + CH / 2);
    }
  }
  buckets.forEach((b, lvl) => {
    const g = lvl === 0 ? 40 : Math.round(70 + 185 * (lvl - 1) / (LEVELS - 1));
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    for (let k = 0; k < b.length; k += 3) ctx.fillText(b[k], b[k + 1], b[k + 2]);
  });

  // marks: white X, red for a moment after they sound
  for (const m of marks) {
    const [x, y] = markXY(m);
    const f = m.flash < 0 ? 0 : Math.max(0, 1 - (now - m.flash) / 0.45);
    ctx.fillStyle = f > 0 ? RED : "#fff";
    ctx.globalAlpha = f > 0 ? 0.55 + 0.45 * f : 1;
    ctx.fillText("X", x, y);
  }
  ctx.globalAlpha = 1;

  // source: charges o -> O -> @ through the beat
  const [x, y] = sourceXY();
  const charge = Math.min(1, (now - lastPulse) / period);
  ctx.fillStyle = RED;
  ctx.fillText(charge < 0.15 ? "@" : charge < 0.6 ? "o" : charge < 0.9 ? "O" : "@", x, y);
}

function frame(ms) {
  now = ms / 1000;
  const dt = Math.min(0.05, now - prev || 0);
  prev = now;
  step(dt);
  fillField();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- input -------------------------------------------------------------

let drag = null;   // { kind: "source", moved } | { kind: "paint", add, cell }

function nearSource(px, py) {
  const [x, y] = sourceXY();
  return Math.hypot(px - x, py - y) < Math.max(22, CW * 2);
}

function paintAt(px, py, add) {
  const fx = Math.min(0.999, Math.max(0, px / W)), fy = Math.min(0.999, Math.max(0, py / H));
  const [c, r] = cellOf(fx, fy);
  const [sc, sr] = cellOf(source.fx, source.fy);
  if (c === sc && r === sr) return;
  const at = marks.findIndex((m) => { const [mc, mr] = cellOf(m.fx, m.fy); return mc === c && mr === r; });
  if (add && at < 0) marks.push({ fx: (c + 0.5) * CW / W, fy: (r + 0.5) * CH / H, flash: -1, last: -1 });
  if (!add && at >= 0) marks.splice(at, 1);
}

function cellKey(px, py) { return Math.floor(px / CW) + "," + Math.floor(py / CH); }

canvas.addEventListener("pointerdown", (e) => {
  startAudio();
  setSoundLabel();
  canvas.setPointerCapture(e.pointerId);
  if (nearSource(e.offsetX, e.offsetY)) {
    drag = { kind: "source", moved: false, x: e.offsetX, y: e.offsetY };
    canvas.className = "grabbing";
    return;
  }
  const [c, r] = [Math.floor(e.offsetX / CW), Math.floor(e.offsetY / CH)];
  const has = marks.some((m) => { const [mc, mr] = cellOf(m.fx, m.fy); return mc === c && mr === r; });
  drag = { kind: "paint", add: !has, cell: cellKey(e.offsetX, e.offsetY) };
  paintAt(e.offsetX, e.offsetY, drag.add);
});

canvas.addEventListener("pointermove", (e) => {
  if (!drag) {
    canvas.className = nearSource(e.offsetX, e.offsetY) ? "grab" : "";
    return;
  }
  if (drag.kind === "source") {
    if (Math.hypot(e.offsetX - drag.x, e.offsetY - drag.y) > 4) drag.moved = true;
    if (drag.moved) {
      source.fx = Math.min(0.999, Math.max(0, e.offsetX / W));
      source.fy = Math.min(0.999, Math.max(0, e.offsetY / H));
      const [sc, sr] = cellOf(source.fx, source.fy);
      marks = marks.filter((m) => { const [mc, mr] = cellOf(m.fx, m.fy); return mc !== sc || mr !== sr; });
    }
    return;
  }
  const key = cellKey(e.offsetX, e.offsetY);
  if (key !== drag.cell) { drag.cell = key; paintAt(e.offsetX, e.offsetY, drag.add); }
});

function endDrag() {
  if (drag && drag.kind === "source" && !drag.moved) { lastPulse = now; pulse(...sourceXY(), 1, null); }
  drag = null;
  canvas.className = "";
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", () => { drag = null; canvas.className = ""; });

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); startAudio(); lastPulse = now; pulse(...sourceXY(), 1, null); }
  else if (e.key === "ArrowUp") { e.preventDefault(); period = Math.max(0.5, +(period - 0.25).toFixed(2)); }
  else if (e.key === "ArrowDown") { e.preventDefault(); period = Math.min(4, +(period + 0.25).toFixed(2)); }
  else if (k === "r") scatter();
  else if (k === "c") { marks = []; rings = []; }
  else if (k === "m") { if (!audio) startAudio(); else muted = !muted; }
  else return;
  setSoundLabel();
});
</script>
</body>
