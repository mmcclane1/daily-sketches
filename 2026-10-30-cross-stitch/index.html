<body>
<div class="label"><a href="../index.html">←</a> 2026-10-30 / cross stitch</div>
<div class="hint">type to stitch · enter for a new line · drag to stitch by hand · esc unpicks</div>
<canvas></canvas>
<script>
// Typed text, rasterised onto an aida-cloth grid and sewn as cross stitches.
// One needle works each row the way it's done by hand: a pass of "/" half
// stitches left to right, then back right to left crossing them with "\".
// Fresh thread is red and dries to white. Deleted letters get unpicked.
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
const RED = [255, 42, 31], WHITE = [232, 232, 232], TOP = [255, 255, 255];
const FONT = (px) => `800 ${px}px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace`;
const K = 4;            // raster supersampling per cell
const FADE = 1.6;       // seconds for red thread to dry to white
const UNPICK = 0.35;    // seconds for an unpicked stitch to vanish
const DEFAULT = "cross\nstitch";

let W, H, cs, cols, rows, fs, lineH, adv, left, textTop, maxCols, maxLines;
let text = DEFAULT, untouched = true;
let cells = new Map();  // key -> { c, r, legs: [leg|null, leg|null], j, dying }
let queue = [];         // pending legs: { cell, k }
let hand = new Set();   // cells stitched by dragging
let lastEnd = 0;        // when the needle finishes its scheduled leg
let trail = [];         // recent needle holes, newest last
let current = null;     // leg the needle is sewing
let cloth;              // cached background
let now = 0;

const raster = document.createElement("canvas");
const rctx = raster.getContext("2d", { willReadFrequently: true });

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cs = Math.max(7, Math.min(14, Math.round(Math.min(W, H) / 64)));
  cols = Math.floor(W / cs); rows = Math.floor(H / cs);
  fs = Math.max(9, Math.floor(Math.min(rows * 0.18, cols * 0.12)));
  lineH = Math.round(fs * 1.12);
  raster.width = cols * K; raster.height = rows * K;
  rctx.font = FONT(fs * K);
  adv = rctx.measureText("M").width / K;
  left = Math.max(3, Math.round(cols * 0.08));
  textTop = Math.max(4, Math.round(rows * 0.2));
  maxCols = Math.max(1, Math.floor((cols - 2 * left) / adv));
  maxLines = Math.max(1, Math.floor((rows - textTop - 3) / lineH));

  // Aida cloth: a faint hole at every grid corner.
  cloth = document.createElement("canvas");
  cloth.width = canvas.width; cloth.height = canvas.height;
  const b = cloth.getContext("2d");
  b.setTransform(dpr, 0, 0, dpr, 0, 0);
  b.fillStyle = "#000"; b.fillRect(0, 0, W, H);
  b.fillStyle = "#1c1c1c";
  for (let r = 0; r <= rows; r++)
    for (let c = 0; c <= cols; c++) b.fillRect(c * cs - 0.5, r * cs - 0.5, 1, 1);

  cells.clear(); queue = []; hand.clear(); trail = []; current = null;
  while (layout(text) === null) text = text.slice(0, -1);
  restitch();
}

// Wrap text into lines that fit the cloth; null if it doesn't fit.
function layout(s) {
  const lines = [];
  for (const raw of s.split("\n")) {
    let line = raw;
    while (line.length > maxCols) { lines.push(line.slice(0, maxCols)); line = line.slice(maxCols); }
    lines.push(line);
  }
  return lines.length > maxLines ? null : lines;
}

// Which cells the text covers.
function textCells() {
  const lines = layout(text) || [];
  rctx.setTransform(1, 0, 0, 1, 0, 0);
  rctx.clearRect(0, 0, raster.width, raster.height);
  rctx.font = FONT(fs * K);
  rctx.textBaseline = "top";
  rctx.fillStyle = "#fff";
  lines.forEach((l, i) => rctx.fillText(l, left * K, (textTop + i * lineH) * K));
  const data = rctx.getImageData(0, 0, raster.width, raster.height).data;
  const out = new Set();
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let sum = 0;
      for (let y = 0; y < K; y++) {
        let i = ((r * K + y) * raster.width + c * K) * 4 + 3;
        for (let x = 0; x < K; x++, i += 4) sum += data[i];
      }
      if (sum > 255 * K * K * 0.35) out.add(r * cols + c);
    }
  }
  return out;
}

function makeCell(key) {
  const r = Math.floor(key / cols), c = key % cols;
  const j = Array.from({ length: 8 }, () => (Math.random() - 0.5) * 0.12 * cs);
  const cell = { c, r, legs: [null, null], j, dying: null };
  cells.set(key, cell);
  return cell;
}

// Diff the target against what's sewn: unpick extras, queue what's missing.
function restitch() {
  const target = textCells();
  for (const k of hand) target.add(k);

  for (const [key, cell] of cells) {
    if (target.has(key)) { cell.dying = null; continue; }
    if (cell.dying !== null) continue;
    if (!cell.legs[0] && !cell.legs[1]) cells.delete(key);
    else cell.dying = now + Math.random() * 0.3;
  }
  queue = queue.filter((q) => cells.get(q.cell.r * cols + q.cell.c) === q.cell);

  const fresh = [];
  for (const key of target) if (!cells.has(key)) fresh.push(makeCell(key));
  fresh.sort((a, b) => a.r - b.r || a.c - b.c);

  // Group into horizontal runs; there and back for each run.
  for (let i = 0; i < fresh.length; ) {
    let j = i + 1;
    while (j < fresh.length && fresh[j].r === fresh[i].r && fresh[j].c === fresh[j - 1].c + 1) j++;
    const run = fresh.slice(i, j);
    for (const cell of run) queue.push({ cell, k: 0 });
    for (let n = run.length - 1; n >= 0; n--) queue.push({ cell: run[n], k: 1 });
    i = j;
  }
}

// Endpoints of a leg: "/" runs bottom-left → top-right, "\" bottom-right → top-left.
function legPts(cell, k) {
  const x = cell.c * cs, y = cell.r * cs, i = cs * 0.15, j = cell.j;
  return k === 0
    ? [x + i + j[0], y + cs - i + j[1], x + cs - i + j[2], y + i + j[3]]
    : [x + cs - i + j[4], y + cs - i + j[5], x + i + j[6], y + i + j[7]];
}

function schedule() {
  const rate = Math.max(40, Math.min(900, queue.length / 2.2)); // legs per second
  if (lastEnd < now - 0.05) lastEnd = now;
  while (queue.length && lastEnd < now + 1 / 60) {
    const { cell, k } = queue.shift();
    if (cell.legs[k] || cell.dying !== null) continue;
    cell.legs[k] = { t0: lastEnd, dur: 1 / rate };
    lastEnd += 1 / rate;
  }
}

function mix(a, b, t) {
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`;
}

function frame(ms) {
  now = ms / 1000;
  schedule();
  ctx.drawImage(cloth, 0, 0, W, H);
  ctx.lineCap = "round";
  const lw = Math.max(1.5, cs * 0.22);

  // Finished, dry stitches batched into one path per leg; everything else per stroke.
  const dry = [new Path2D(), new Path2D()];
  let active = null;
  for (const [key, cell] of cells) {
    let life = 1;
    if (cell.dying !== null && now > cell.dying) {
      life = 1 - (now - cell.dying) / UNPICK;
      if (life <= 0) { cells.delete(key); continue; }
    }
    for (let k = 0; k < 2; k++) {
      const leg = cell.legs[k];
      if (!leg || now < leg.t0) continue;
      const p = Math.min(1, (now - leg.t0) / leg.dur);
      let [x0, y0, x1, y1] = legPts(cell, k);
      if (p < 1) { x1 = x0 + (x1 - x0) * p; y1 = y0 + (y1 - y0) * p; active = { x: x1, y: y1, x0, y0 }; }
      const age = now - leg.t0 - leg.dur;
      if (life === 1 && age > FADE) {
        dry[k].moveTo(x0, y0); dry[k].lineTo(x1, y1);
        continue;
      }
      if (life < 1) { // shrink toward the cell centre as it's pulled out
        const cx = cell.c * cs + cs / 2, cy = cell.r * cs + cs / 2;
        x0 = cx + (x0 - cx) * life; y0 = cy + (y0 - cy) * life;
        x1 = cx + (x1 - cx) * life; y1 = cy + (y1 - cy) * life;
      }
      ctx.globalAlpha = life;
      ctx.strokeStyle = mix(RED, k ? TOP : WHITE, Math.max(0, age) / FADE);
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = lw;
  ctx.strokeStyle = `rgb(${WHITE})`; ctx.stroke(dry[0]); // "\" legs on top are a touch brighter
  ctx.strokeStyle = `rgb(${TOP})`; ctx.stroke(dry[1]);

  drawNeedle(active);
  drawCaret();
  requestAnimationFrame(frame);
}

// A loose red thread through the last few holes, and the needle at its tip.
function drawNeedle(active) {
  if (active) {
    const last = trail[trail.length - 1];
    if (!last || Math.hypot(last.x - active.x0, last.y - active.y0) > 0.5) trail.push({ x: active.x0, y: active.y0, t: now });
    if (trail.length > 10) trail.shift();
    current = active;
  }
  if (!current) return;
  const idle = active ? 0 : now - trail[trail.length - 1].t;
  const a = Math.max(0, 1 - idle / 1.2);
  if (a <= 0) { current = null; trail = []; return; }

  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(255,42,31,${0.55 * a})`;
  ctx.beginPath();
  trail.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.lineTo(current.x, current.y);
  ctx.stroke();

  const dx = current.x - current.x0, dy = current.y - current.y0, d = Math.hypot(dx, dy) || 1;
  ctx.globalAlpha = a;
  ctx.strokeStyle = "#ff2a1f";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(current.x, current.y);
  ctx.lineTo(current.x + (dx / d) * cs * 1.8, current.y + (dy / d) * cs * 1.8);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// Blinking caret: a column of small red x marks where the next letter goes.
function drawCaret() {
  if (untouched || Math.floor(now * 1.6) % 2) return;
  const lines = layout(text) || [""];
  const li = lines.length - 1;
  const c = Math.round(left + lines[li].length * adv) + 1;
  const r0 = textTop + li * lineH, n = Math.round(fs * 0.85), s = cs * 0.22;
  ctx.strokeStyle = "#ff2a1f";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let r = r0 + Math.round(fs * 0.12); r < r0 + n; r += 2) {
    const x = c * cs + cs / 2, y = r * cs + cs / 2;
    ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
    ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
  }
  ctx.stroke();
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  let next = null;
  if (e.key === "Escape") { text = ""; hand.clear(); untouched = false; restitch(); return; }
  if (e.key === "Backspace") next = text.slice(0, -1);
  else if (e.key === "Enter") next = (untouched ? "" : text) + "\n";
  else if (e.key.length === 1) next = (untouched ? "" : text) + e.key;
  else return;
  e.preventDefault();
  if (!layout(next)) return; // cloth is full
  text = next; untouched = false;
  restitch();
});

// Drag to stitch cells by hand; they skip the queue and sew immediately.
let drawing = false, prev = null;
function stitchAt(x, y) {
  const c = Math.floor(x / cs), r = Math.floor(y / cs);
  if (c < 0 || r < 0 || c >= cols || r >= rows) return;
  const key = r * cols + c;
  hand.add(key);
  const cell = cells.get(key) || makeCell(key);
  cell.dying = null;
  if (!cell.legs[0]) cell.legs[0] = { t0: now, dur: 0.07 };
  if (!cell.legs[1]) cell.legs[1] = { t0: Math.max(now, cell.legs[0].t0 + cell.legs[0].dur), dur: 0.07 };
}
canvas.addEventListener("pointerdown", (e) => {
  drawing = true; prev = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
  stitchAt(e.clientX, e.clientY);
});
canvas.addEventListener("pointermove", (e) => {
  if (!drawing) return;
  const n = Math.ceil(Math.hypot(e.clientX - prev.x, e.clientY - prev.y) / (cs * 0.5));
  for (let i = 1; i <= n; i++) stitchAt(prev.x + ((e.clientX - prev.x) * i) / n, prev.y + ((e.clientY - prev.y) * i) / n);
  prev = { x: e.clientX, y: e.clientY };
});
addEventListener("pointerup", () => (drawing = false));
addEventListener("pointercancel", () => (drawing = false));

let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });
resize();
requestAnimationFrame(frame);
</script>
</body>
